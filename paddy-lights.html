<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paddy Field Lights</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #081c3c;
  }

  /* Image container: covers the viewport but keeps the photo's 1448:1086 ratio.
     Hotspots are placed in % of this box, so they stay locked to the image.
     On wide screens the overflow is cropped mostly from the bottom (20% top / 80% bottom)
     so the bulbs near the top stay in view. */
  .scene {
    position: fixed;
    left: 50%;
    top: 20%;
    width: max(100vw, 100vh * 1448 / 1086);
    aspect-ratio: 1448 / 1086;
    transform: translate(-50%, -20%);
  }
  .scene img {
    display: block;
    width: 100%;
    height: 100%;
    user-select: none;
  }

  /* Invisible circular hotspot, centred on its bulb */
  .bulb {
    position: absolute;
    width: 4.4%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: none;
    cursor: pointer;
    mix-blend-mode: screen; /* glow adds light to the photo */
    -webkit-tap-highlight-color: transparent;
  }
  .bulb::before,
  .bulb::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .bulb::before { /* soft halo */
    width: 260%;
    height: 260%;
    background: radial-gradient(circle, rgba(255, 190, 110, 0.55) 0%, rgba(255, 160, 70, 0.2) 35%, rgba(255, 150, 60, 0) 70%);
  }
  .bulb::after { /* bright amber core */
    width: 130%;
    height: 130%;
    background: radial-gradient(circle, rgba(255, 238, 200, 0.95) 0%, rgba(255, 196, 110, 0.6) 30%, rgba(255, 170, 70, 0) 68%);
  }
  @media (hover: hover) {
    .bulb:hover::before { opacity: 0.6; }
  }
  .bulb:focus-visible {
    outline: 2px solid rgba(255, 214, 150, 0.8);
    outline-offset: 2px;
  }
  .bulb.lit::before,
  .bulb.lit::after { opacity: 1; }

  /* Content panel, centred on screen */
  .panel-wrap {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 1rem;
    pointer-events: none;
  }
  .panel {
    position: relative;
    box-sizing: border-box;
    width: min(34rem, 100%);
    max-height: 100%;
    overflow-y: auto;
    padding: clamp(1.75rem, 5vw, 2.5rem);
    color: #f3e9d8;
    background: rgba(10, 14, 28, 0.55);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 220, 170, 0.14);
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    pointer-events: auto;
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity 0.35s ease, transform 0.35s ease, visibility 0s 0.35s;
  }
  .panel.open {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .panel h2 {
    margin: 0 1.5rem 1rem 0;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: 0.01em;
    color: #fbe7c6;
  }
  .panel p {
    margin: 0 0 1em;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.7;
  }
  .panel p:last-child { margin-bottom: 0; }
  .close {
    position: absolute;
    top: 0.6rem;
    right: 0.6rem;
    width: 2rem;
    height: 2rem;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: none;
    color: inherit;
    font-size: 1.5rem;
    line-height: 1;
    opacity: 0.6;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .close:hover,
  .close:focus-visible { opacity: 1; }
</style>
</head>
<body>

<div class="scene" id="scene">
  <img id="bg" alt="" width="1448" height="1086" draggable="false">
</div>

<div class="panel-wrap">
  <div class="panel" id="panel" role="dialog" aria-labelledby="panel-title">
    <button class="close" id="close" type="button" aria-label="Close">&times;</button>
    <div id="panel-body">
      <h2 id="panel-title"></h2>
      <div id="panel-text"></div>
    </div>
  </div>
</div>

<script>
  // Content for each bulb, left to right. Placeholder text: replace with your own.
  const CONTENT = [
    {
      title: "Bulb One",
      paragraphs: [
        "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
        "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum."
      ]
    },
    {
      title: "Bulb Two",
      paragraphs: [
        "Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.",
        "Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt."
      ]
    },
    {
      title: "Bulb Three",
      paragraphs: [
        "Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit, sed quia non numquam eius modi tempora incidunt ut labore et dolore magnam aliquam quaerat voluptatem.",
        "Ut enim ad minima veniam, quis nostrum exercitationem ullam corporis suscipit laboriosam, nisi ut aliquid ex ea commodi consequatur."
      ]
    },
    {
      title: "Bulb Four",
      paragraphs: [
        "Quis autem vel eum iure reprehenderit qui in ea voluptate velit esse quam nihil molestiae consequatur, vel illum qui dolorem eum fugiat quo voluptas nulla pariatur.",
        "At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident."
      ]
    },
    {
      title: "Bulb Five",
      paragraphs: [
        "Similique sunt in culpa qui officia deserunt mollitia animi, id est laborum et dolorum fuga. Et harum quidem rerum facilis est et expedita distinctio.",
        "Nam libero tempore, cum soluta nobis est eligendi optio cumque nihil impedit quo minus id quod maxime placeat facere possimus, omnis voluptas assumenda est, omnis dolor repellendus."
      ]
    },
    {
      title: "Bulb Six",
      paragraphs: [
        "Temporibus autem quibusdam et aut officiis debitis aut rerum necessitatibus saepe eveniet ut et voluptates repudiandae sint et molestiae non recusandae.",
        "Itaque earum rerum hic tenetur a sapiente delectus, ut aut reiciendis voluptatibus maiores alias consequatur aut perferendis doloribus asperiores repellat."
      ]
    },
    {
      title: "Bulb Seven",
      paragraphs: [
        "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus sagittis lacus vel augue laoreet rutrum faucibus dolor auctor. Maecenas faucibus mollis interdum.",
        "Cras mattis consectetur purus sit amet fermentum. Donec ullamcorper nulla non metus auctor fringilla. Etiam porta sem malesuada magna mollis euismod."
      ]
    }
  ];

  // Bulb centres as [x, y] in % of the image, left to right
  // (centroid of each bulb's glowing glass, measured from the photo).
  const BULBS = [
    [12.90, 20.19], [31.90, 19.95], [48.25, 18.63], [62.16, 18.02],
    [75.54, 15.90], [86.37, 14.42], [91.76, 18.35]
  ];

  const scene = document.getElementById("scene");
  const panel = document.getElementById("panel");
  const panelBody = document.getElementById("panel-body");
  const panelTitle = document.getElementById("panel-title");
  const panelText = document.getElementById("panel-text");
  let current = -1;

  const bulbs = BULBS.map(([x, y], i) => {
    const bulb = document.createElement("button");
    bulb.type = "button";
    bulb.className = "bulb";
    bulb.style.left = x + "%";
    bulb.style.top = y + "%";
    bulb.setAttribute("aria-label", CONTENT[i].title);
    bulb.addEventListener("click", () => (i === current ? close() : open(i)));
    scene.append(bulb);
    return bulb;
  });

  function open(i) {
    if (current >= 0) {
      bulbs[current].classList.remove("lit");
      panelBody.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, easing: "ease-out" });
    }
    current = i;
    bulbs[i].classList.add("lit");
    panelTitle.textContent = CONTENT[i].title;
    panelText.replaceChildren(...CONTENT[i].paragraphs.map((text) => {
      const p = document.createElement("p");
      p.textContent = text;
      return p;
    }));
    panel.classList.add("open");
  }

  function close() {
    if (current < 0) return;
    if (panel.contains(document.activeElement)) bulbs[current].focus();
    bulbs[current].classList.remove("lit");
    panel.classList.remove("open");
    current = -1;
  }

  document.getElementById("close").addEventListener("click", close);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") close();
  });
  document.addEventListener("pointerdown", (e) => {
    if (!panel.contains(e.target) && !e.target.closest(".bulb")) close();
  });
</script>
